name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK مثبّت مسبقًا على runner؛ نقبل التراخيص فقط ليتمكن AGP من تنزيل المنصة وأدوات البناء.
      - name: قبول تراخيص Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null

      # يثبّت Gradle 9.3.1 (نفس إصدار AGP 9.1.1 المطلوب) ليُستخدم فقط لتوليد الـ Wrapper إن لم يكن في المستودع.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: تجهيز Gradle Wrapper
        id: wrapper
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Gradle Wrapper موجود في المستودع."
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Gradle Wrapper غير موجود في المستودع؛ سيُولَّد الآن لهذا التشغيل. نزّل Artifact باسم gradle-wrapper-files وأضف ملفاته إلى المستودع."
            tmp="$RUNNER_TEMP/wrapper-gen"
            mkdir -p "$tmp"
            (cd "$tmp" && gradle wrapper --gradle-version 9.3.1 --distribution-type bin)
            cp "$tmp/gradlew" "$tmp/gradlew.bat" .
            mkdir -p gradle/wrapper
            cp "$tmp"/gradle/wrapper/* gradle/wrapper/
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
          chmod +x gradlew

      - name: رفع ملفات الـ Wrapper المولّدة
        if: steps.wrapper.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
          if-no-files-found: error

      - name: تشغيل الاختبارات
        run: ./gradlew --no-daemon test

      - name: بناء Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: رفع تقارير الاختبار
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
