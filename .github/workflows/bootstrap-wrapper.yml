name: Bootstrap Gradle Wrapper

# يُشغَّل يدويًا مرة واحدة فقط لتوليد ملفات Gradle Wrapper الرسمية.
on:
  workflow_dispatch:

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: توليد الـ Wrapper
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper-out"
          cd "$RUNNER_TEMP/wrapper-out"
          touch settings.gradle
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          ls -R .

      - uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: |
            ${{ runner.temp }}/wrapper-out/gradlew
            ${{ runner.temp }}/wrapper-out/gradlew.bat
            ${{ runner.temp }}/wrapper-out/gradle/wrapper/
          if-no-files-found: error
